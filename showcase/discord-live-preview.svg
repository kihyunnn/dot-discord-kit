<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-redacted Discord thread preview</title>
  <desc id="desc">A sanitized Discord-style preview showing a Dot thread conversation. No real server, user, message, or identifier is included.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop stop-color="#5865f2"/><stop offset="1" stop-color="#7289da"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#1e1f22"/>
  <rect x="0" y="0" width="260" height="900" fill="#111214"/>
  <rect x="260" y="0" width="360" height="900" fill="#2b2d31"/>
  <rect x="620" y="0" width="980" height="900" fill="#313338"/>
  <rect x="0" y="0" width="1600" height="8" fill="url(#top)"/>
  <text x="30" y="56" fill="#f2f3f5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Dot Discord Kit</text>
  <text x="30" y="88" fill="#949ba4" font-family="Inter,Arial,sans-serif" font-size="14">SANITIZED SHOWCASE</text>
  <circle cx="74" cy="155" r="38" fill="#5865f2"/>
  <path d="M54 161c7-19 33-19 40 0-10 8-30 8-40 0Z" fill="#fff" opacity=".9"/>
  <text x="30" y="236" fill="#b5bac1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">SERVERS</text>
  <rect x="24" y="260" width="80" height="80" rx="24" fill="#404249"/>
  <text x="52" y="310" fill="#f2f3f5" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">D</text>
  <rect x="292" y="28" width="290" height="52" rx="8" fill="#1e1f22"/>
  <text x="316" y="61" fill="#f2f3f5" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"># dot</text>
  <text x="292" y="130" fill="#949ba4" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">DOT THREADS</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="282" y="150" width="316" height="68" rx="10" fill="#404249"/>
    <circle cx="312" cy="184" r="18" fill="#5865f2"/>
    <text x="345" y="180" fill="#f2f3f5" font-size="15" font-weight="700">Product research</text>
    <text x="345" y="201" fill="#b5bac1" font-size="12">Dot · 2 replies</text>
    <rect x="282" y="232" width="316" height="68" rx="10" fill="#35373c"/>
    <circle cx="312" cy="266" r="18" fill="#3ba55d"/>
    <text x="345" y="262" fill="#f2f3f5" font-size="15" font-weight="700">Setup diagnosis</text>
    <text x="345" y="283" fill="#b5bac1" font-size="12">Dot · ready to review</text>
  </g>
  <rect x="620" y="0" width="980" height="74" fill="#313338"/>
  <text x="662" y="46" fill="#f2f3f5" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"># product-research</text>
  <text x="1450" y="46" fill="#b5bac1" font-family="Inter,Arial,sans-serif" font-size="14">PERSISTENT THREAD</text>
  <line x1="660" y1="120" x2="1545" y2="120" stroke="#4e5058"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="704" cy="178" r="24" fill="#5865f2"/>
    <text x="745" y="174" fill="#f2f3f5" font-size="17" font-weight="700">You</text>
    <text x="785" y="174" fill="#949ba4" font-size="12">today at 10:24</text>
    <text x="745" y="205" fill="#dbdee1" font-size="16">Recommend the best setup for my environment.</text>
    <rect x="744" y="230" width="710" height="52" rx="8" fill="#25262a"/>
    <text x="766" y="262" fill="#949ba4" font-size="13">[request] discovery → diagnosis → consent → verify</text>
    <circle cx="704" cy="362" r="24" fill="#5865f2"/>
    <text x="745" y="358" fill="#f2f3f5" font-size="17" font-weight="700">Dot</text>
    <text x="785" y="358" fill="#949ba4" font-size="12">today at 10:25</text>
    <rect x="745" y="382" width="690" height="170" rx="12" fill="#25262a" filter="url(#shadow)"/>
    <text x="770" y="420" fill="#57f287" font-size="14" font-weight="700">DIAGNOSIS READY</text>
    <text x="770" y="453" fill="#dbdee1" font-size="16">Recommended: persistent threads + owner-only access</text>
    <text x="770" y="484" fill="#b5bac1" font-size="14">Local CDP: available · DevSpace: optional ·</text>
    <text x="770" y="509" fill="#b5bac1" font-size="14">Consent required before Bot install or file changes.</text>
    <rect x="770" y="585" width="220" height="44" rx="8" fill="#5865f2"/>
    <text x="823" y="613" fill="#fff" font-size="15" font-weight="700">Choose profile</text>
    <rect x="1005" y="585" width="150" height="44" rx="8" fill="#4e5058"/>
    <text x="1048" y="613" fill="#dbdee1" font-size="15" font-weight="700">Details</text>
    <rect x="662" y="780" width="870" height="60" rx="10" fill="#383a40"/>
    <text x="690" y="817" fill="#949ba4" font-size="15">Message #product-research</text>
  </g>
  <rect x="0" y="850" width="1600" height="50" fill="#111214"/>
  <text x="30" y="881" fill="#949ba4" font-family="Inter,Arial,sans-serif" font-size="13">Illustration only · all names, messages, IDs, and server data are fictional</text>
</svg>
